name: Portable configuration contracts
on:
  pull_request:
  push:
    branches: [master]
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML boto3 pytest
      - run: python tools/static_validate.py
      - run: python -m pytest -q tests
      - if: runner.os == 'Linux'
        run: docker compose --profile full --profile checks config --quiet
